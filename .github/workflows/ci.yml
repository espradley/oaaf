name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Runs first: a boundary violation should fail before anything slower.
      - name: Dependency boundary
        run: npm run check:boundary

      - name: Governance files
        run: npm run check:governance

      - name: Format
        run: npm run format:check

      - name: Typecheck and build
        run: npm run typecheck

      - name: Test
        run: npm test
