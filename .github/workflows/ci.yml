name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      # Runs first: a boundary violation should fail before anything slower.
      - name: Dependency boundary
        run: npm run check:boundary

      - name: Governance files
        run: npm run check:governance

      - name: Format
        run: npm run format:check

      - name: Typecheck and build
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package (downstream consumer certification)
        run: npm run check:package

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (Python package + test deps)
        working-directory: python
        run: pip install -e . pytest

      - name: Cross-language parity (Python side)
        working-directory: python
        run: python -m pytest tests/ -q
