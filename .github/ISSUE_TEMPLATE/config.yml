      "show what you are integrating" belong here rather than as bugs.
  - name: The outsider adoption journey
    url: https://github.com/espradley/oaaf/blob/main/docs/adoption-journey.md
    about: >-
      New here? The step-by-step path from discovering OAAF to depending on it —
      try, install, verify, adopt, contribute.
